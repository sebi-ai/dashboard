<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard</title>
<style>
  :root {
    --bg: #0d0d1a;
    --widget-bg: #16162a;
    --accent: #00d4ff;
    --text: #e0e0ff;
    --border: #2a2a50;
    --muted: #6666aa;
    --positive: #00ff88;
    --negative: #ff4466;
    --font-family: 'Orbitron', 'Segoe UI', system-ui, sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-family);
  }

  #dashboard {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    padding: 18px 22px;
    position: relative;
  }

  /* --- Header --- */
  #header {
    flex-shrink: 0;
    padding-bottom: 6px;
  }
  #header h1 {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 1px;
  }
  #header-line {
    height: 2px;
    margin-top: 4px;
    border-radius: 1px;
  }

  /* --- Content area --- */
  #content {
    flex: 1;
    position: relative;
    margin-top: 14px;
    min-height: 0;
  }

  /* --- Widget card --- */
  .widget-card {
    position: absolute;
    border-radius: 30px;
    padding: 12px 18px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transition: background 0.3s, border-color 0.3s;
  }
  .widget-card .widget-inner {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .widget-header {
    display: flex;
    align-items: center;
    margin-bottom: 8px;
    flex-shrink: 0;
  }
  .widget-header span {
    font-size: calc(12px * var(--scale, 1));
    font-weight: 700;
    letter-spacing: 0.5px;
  }
  .widget-header-line {
    height: 2px;
    width: 72px;
    margin-bottom: 10px;
    border-radius: 1px;
    flex-shrink: 0;
  }
  .widget-body {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 0;
    overflow: hidden;
  }
  .widget-spacer {
    flex: 1;
  }

  /* --- Footer --- */
  #footer {
    flex-shrink: 0;
    padding-top: 5px;
  }
  #footer-line {
    height: 1px;
    margin-bottom: 5px;
    border-radius: 0.5px;
  }
  #footer-content {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  #footer-content span {
    font-size: 9px;
  }

  /* --- Exit button --- */
  #back-btn {
    position: fixed;
    top: 12px;
    right: 16px;
    z-index: 2147483647;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--widget-bg);
    color: var(--muted);
    cursor: pointer;
    font-size: 16px;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    font-family: var(--font-family);
  }
  #back-btn:hover {
    color: var(--accent);
    border-color: var(--accent);
  }

  /* --- Utility --- */
  .text-center { text-align: center; }
  .text-left { text-align: left; }
  .text-right { text-align: right; }
  .bold { font-weight: 700; }

  /* --- List rows --- */
  .list-row {
    display: flex;
    align-items: flex-start;
    padding: 3px 0;
    gap: 6px;
  }
  .list-row .dot {
    width: 16px;
    text-align: center;
    flex-shrink: 0;
    font-size: calc(12px * var(--scale, 1));
  }
  .list-row .info {
    flex: 1;
    min-width: 0;
  }
  .list-row .info .line1 {
    font-size: calc(11px * var(--scale, 1));
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .list-row .info .line2 {
    font-size: calc(11px * var(--scale, 1));
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .list-row .date-col {
    font-size: calc(12px * var(--scale, 1));
    width: calc(14px * var(--scale, 1) * 5.5);
    flex-shrink: 0;
    text-align: left;
  }

  /* --- Status / loading --- */
  .status-msg {
    font-size: calc(13px * var(--scale, 1));
    text-align: left;
    line-height: 1.4;
  }

  /* --- Fullscreen overrides */
  :fullscreen #dashboard {
    padding: 22px 28px;
  }
</style>
</head>
<body>

<div id="dashboard">
  <div id="header">
    <h1>DASHBOARD</h1>
    <div id="header-line"></div>
  </div>
  <div id="content"></div>
  <div id="footer">
    <div id="footer-line"></div>
    <div id="footer-content">
      <span id="footer-hint">ESC exit fullscreen • F11 fullscreen • R reload • Q quit</span>
      <span id="footer-location"></span>
    </div>

</div>

<button id="back-btn" title="Back (B)">&lt;</button>

const SERVER_URL = "http://localhost:8000";

// ============================================================
//  COLOR UTILITIES
// ============================================================

function hexToRgb(hex) {
  hex = hex.replace("#", "");
  if (hex.length === 3) {
    hex = hex[0]+hex[0]+hex[1]+hex[1]+hex[2]+hex[2];
  }
  const r = parseInt(hex.substring(0,2), 16);
  const g = parseInt(hex.substring(2,4), 16);
  const b = parseInt(hex.substring(4,6), 16);
  return [r, g, b];
}

function rgbToHex(r, g, b) {
  return "#" + [r, g, b].map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, "0")).join("");
}

function rgbToHsv(r, g, b) {
  r /= 255; g /= 255; b /= 255;
  const max = Math.max(r, g, b), min = Math.min(r, g, b);
  const d = max - min;
  let h = 0;
  const s = max === 0 ? 0 : d / max;
  const v = max;
  if (d !== 0) {
    if (max === r) h = ((g - b) / d + (g < b ? 6 : 0)) / 6;
    else if (max === g) h = ((b - r) / d + 2) / 6;
    else h = ((r - g) / d + 4) / 6;
  }
  return [h, s, v];
}

function hsvToRgb(h, s, v) {
  let r, g, b;
  const i = Math.floor(h * 6);
  const f = h * 6 - i;
  const p = v * (1 - s);
  const q = v * (1 - f * s);
  const t = v * (1 - (1 - f) * s);
  switch (i % 6) {
    case 0: r = v; g = t; b = p; break;
    case 1: r = q; g = v; b = p; break;
    case 2: r = p; g = v; b = t; break;
    case 3: r = p; g = q; b = v; break;
    case 4: r = t; g = p; b = v; break;
    case 5: r = v; g = p; b = q; break;
  }
  return [r * 255, g * 255, b * 255];
}

function generateThemeFromColor(hexColor) {
  let [r, g, b] = hexToRgb(hexColor);
  let [h, s, v] = rgbToHsv(r, g, b);

  // bg: dark (V ~12-22%)
  const bgV = Math.max(0.12, Math.min(0.22, v * 0.3));
  const bgS = Math.min(0.8, s * 1.2);
  const [bgR, bgG, bgB] = hsvToRgb(h, bgS, bgV);
  const bgHex = rgbToHex(bgR, bgG, bgB);

  // widget_bg: lighter (V ~30-45%)
  const widgetV = Math.min(0.45, Math.max(0.30, bgV * 2.0));
  const [wR, wG, wB] = hsvToRgb(h, bgS, widgetV);
  const widgetHex = rgbToHex(wR, wG, wB);

  // accent: bright version (V ~70-85%)
  const accentV = Math.min(0.85, v * 1.5);
  const accentS = Math.min(0.95, s * 1.1);
  const [aR, aG, aB] = hsvToRgb(h, accentS, accentV);
  const accentHex = rgbToHex(aR, aG, aB);

  // border: very light (V ~90%)
  const borderV = 0.90;
  const borderS = Math.min(0.3, s * 0.5);
  const [bR, bG, bB] = hsvToRgb(h, borderS, borderV);
  const borderHex = rgbToHex(bR, bG, bB);

  // text: pure white
  const textHex = "#ffffff";

  // muted: medium light (V ~60%)
  const mutedV = 0.60;
  const mutedS = Math.max(0.05, s * 0.1);
  const [mR, mG, mB] = hsvToRgb(h, mutedS, mutedV);
  const mutedHex = rgbToHex(mR, mG, mB);

  // positive: bright green
  const [posR, posG, posB] = hsvToRgb(120/360, 0.8, 0.9);
  const positiveHex = rgbToHex(posR, posG, posB);

  // negative: bright red
  const [negR, negG, negB] = hsvToRgb(0, 0.8, 0.9);
  const negativeHex = rgbToHex(negR, negG, negB);

  return {
    bg: bgHex, widget_bg: widgetHex, accent: accentHex,
    text: textHex, border: borderHex, muted: mutedHex,
    positive: positiveHex, negative: negativeHex,
  };
}

function hexToLuminance(hexColor) {
  const [r, g, b] = hexToRgb(hexColor);
  const rNorm = r / 255, gNorm = g / 255, bNorm = b / 255;
  const rSrgb = rNorm <= 0.03928 ? rNorm / 12.92 : Math.pow((rNorm + 0.055) / 1.055, 2.4);
  const gSrgb = gNorm <= 0.03928 ? gNorm / 12.92 : Math.pow((gNorm + 0.055) / 1.055, 2.4);
  const bSrgb = bNorm <= 0.03928 ? bNorm / 12.92 : Math.pow((bNorm + 0.055) / 1.055, 2.4);
  return 0.2126 * rSrgb + 0.7152 * gSrgb + 0.0722 * bSrgb;
}

function getContrastRatio(color1, color2) {
  const l1 = hexToLuminance(color1);
  const l2 = hexToLuminance(color2);
  const lighter = Math.max(l1, l2);
  const darker = Math.min(l1, l2);
  if (darker === 0) return Infinity;
  return (lighter + 0.05) / (darker + 0.05);
}

function getContrastAwareTextColor(bgColor, preferredColor) {
  const MIN_CONTRAST = 4.5;
  if (getContrastRatio(preferredColor, bgColor) >= MIN_CONTRAST) return preferredColor;
  if (getContrastRatio("#ffffff", bgColor) >= MIN_CONTRAST) return "#ffffff";
  if (getContrastRatio("#000000", bgColor) >= MIN_CONTRAST) return "#000000";
  return getContrastRatio("#ffffff", bgColor) >= getContrastRatio("#000000", bgColor) ? "#ffffff" : "#000000";
}

// ============================================================
//  SETTINGS
// ============================================================

let settings = {};
let settingsMtime = null;

async function loadSettings() {
  try {
    const resp = await fetch("settings.json?t=" + Date.now(), { cache: "no-store" });
    if (resp.ok) {
      settings = await resp.json();
      return settings;
    }
  } catch (e) {
    console.warn("[dashboard] settings.json load error:", e);
  }
  return {};
}

function extractColors(cfg) {
  const themeName = cfg.theme || "default";
  const themeMode = cfg.themeMode;
  const customColor = cfg.customColor;
  const presetTheme = cfg.theme;

  let base;

  if (themeMode === "custom" && customColor) {
    base = generateThemeFromColor(customColor);
  } else if (themeMode === "preset" && presetTheme) {
    const themeMapping = {
      light: "light", dark: "dark", blue: "default",
      green: "forest", red: "sunset", pink: "pink",
      purple: "midnight",
    };
    let themeKey = themeMapping[presetTheme];
    if (themeKey === undefined && THEMES[presetTheme]) themeKey = presetTheme;
    base = { ...THEMES[themeKey || "default"] };

    if (customColor && typeof customColor === "string" && customColor.startsWith("#")) {
      base.accent = customColor;
      base.border = customColor;
    }
  } else {
    base = { ...THEMES[themeName] || THEMES.default };
  }

  // Overrides (only if not in custom mode)
  if (themeMode !== "custom" || !customColor) {
    const overrides = {
      accent: cfg.accentColor || cfg.primaryColor || cfg.customColor || cfg.themeColor,
      bg: cfg.backgroundColor || cfg.bgColor,
      text: cfg.textColor,
      widget_bg: cfg.widgetBgColor || cfg.cardColor || cfg.cardBgColor,
      border: cfg.borderColor,
      muted: cfg.secondaryTextColor || cfg.mutedColor,
    };
    for (const [key, val] of Object.entries(overrides)) {
      if (val && typeof val === "string" && val.startsWith("#")) {
        base[key] = val;
      }
    }
  }

  return base;
}

// ============================================================
//  APPLY THEME
// ============================================================

function applyTheme(colors) {
  const root = document.documentElement;
  root.style.setProperty("--bg", colors.bg);
  root.style.setProperty("--widget-bg", colors.widget_bg);
  root.style.setProperty("--accent", colors.accent);
  root.style.setProperty("--text", colors.text);
  root.style.setProperty("--border", colors.border);
  root.style.setProperty("--muted", colors.muted);
  root.style.setProperty("--positive", colors.positive);
  root.style.setProperty("--negative", colors.negative);

  // Update header
  const hdr = document.getElementById("header");
  if (hdr) {
    const title = hdr.querySelector("h1");
    if (title) title.style.color = getContrastAwareTextColor(colors.bg, colors.accent);
    const line = document.getElementById("header-line");
    if (line) line.style.background = colors.accent;
  }

  // Update footer
  const fLine = document.getElementById("footer-line");
  if (fLine) fLine.style.background = colors.border;
}

// ============================================================
//  LAYOUT
// ============================================================

const LAYOUT_PRESETS = new Set(["twoUnequal", "quadrants", "threeColumns", "threeUnequal"]);

function autoLayout(preset, keys) {
  keys = [...keys];
  const n = keys.length;
  const cells = {};

  if (preset === "twoUnequal") {
    if (n) cells[keys[0]] = { x: 0, y: 0, w: 45, h: 100 };
    const nrows = Math.max(1, n - 1);
    for (let i = 0; i < keys.length - 1; i++) {
      const key = keys[i + 1];
      cells[key] = { x: 46, y: 100 * i / nrows, w: 54, h: 100 / nrows };
    }
  } else if (preset === "threeColumns" || preset === "threeUnequal") {
    const cols = preset === "threeColumns" ? [33, 33, 34] : [25, 45, 30];
    const nrows = Math.max(1, Math.ceil(n / 3));
    for (let i = 0; i < keys.length; i++) {
      const key = keys[i];
      const cx = cols.slice(0, i % 3).reduce((a, b) => a + b, 0);
      cells[key] = { x: cx, y: 100 * Math.floor(i / 3) / nrows, w: cols[i % 3], h: 100 / nrows };
    }
  } else {
    // quadrants
    const nrows = Math.max(2, Math.ceil(n / 2));
    for (let i = 0; i < keys.length; i++) {
      const key = keys[i];
      cells[key] = { x: (i % 2) * 50, y: 100 * Math.floor(i / 2) / nrows, w: 50, h: 100 / nrows };
    }
  }
  return cells;
}

function resolveWidgetLayout(enabledKeys, layout) {
  layout = layout || {};
  let preset = layout.preset || "twoUnequal";
  if (!LAYOUT_PRESETS.has(preset)) preset = "twoUnequal";
  const cells = layout.cells || {};

  const columns = (layout.columns || []).filter(v => typeof v === "number" && v > 0);
  const rows = (layout.rows || []).filter(v => typeof v === "number" && v > 0);

  const rects = {};
  let valid = true;

  for (const key of enabledKeys) {
    const cell = cells[key];
    if (!cell) { valid = false; break; }

    let x, y, w, h;
    if (cell.x !== undefined && cell.y !== undefined && cell.w !== undefined && cell.h !== undefined) {
      x = +cell.x; y = +cell.y; w = +cell.w; h = +cell.h;
    } else if (cell.c !== undefined && cell.r !== undefined && cell.cs !== undefined && cell.rs !== undefined && columns.length && rows.length) {
      const ncols = columns.length, nrows = rows.length;
      const colTotal = columns.reduce((a, b) => a + b, 0);
      const rowTotal = rows.reduce((a, b) => a + b, 0);
      const c = +cell.c, r = +cell.r;
      const cs = Math.max(1, +cell.cs || 1);
      const rs = Math.max(1, +cell.rs || 1);
      if (c < 0 || r < 0 || c + cs > ncols || r + rs > nrows) { valid = false; break; }
      x = columns.slice(0, c).reduce((a, b) => a + b, 0) / colTotal * 100;
      w = columns.slice(c, c + cs).reduce((a, b) => a + b, 0) / colTotal * 100;
      y = rows.slice(0, r).reduce((a, b) => a + b, 0) / rowTotal * 100;
      h = rows.slice(r, r + rs).reduce((a, b) => a + b, 0) / rowTotal * 100;
    } else {
      valid = false; break;
    }

    if (w <= 0 || h <= 0 || x < -0.01 || y < -0.01 || x + w > 100.01 || y + h > 100.01) {
      valid = false; break;
    }
    rects[key] = { x, y, w, h };
  }

  if (!valid || enabledKeys.some(k => !(k in rects))) {
    return autoLayout(preset, enabledKeys);
  }
  return rects;
}

const NATURAL_HEIGHT = {
  weather: 125, dateTime: 120, stockCrypto: 135,
  notifications: 135, calendar: 150, countdown: 125,
};
const BIG_EXTRA_HEIGHT = 75;

// ============================================================
//  WIDGET FACTORY
// ============================================================

const widgetInstances = [];

function destroyWidgets() {
  for (const w of widgetInstances) {
    if (w.destroy) w.destroy();
  }
  widgetInstances.length = 0;
}

function createWidget(key, container, colors, big, cfg, scale, cardHPx) {
  const ctx = { key, container, colors, big, settings: cfg, scale: Math.max(scale, 0.5), cardHPx, _alive: true };

  switch (key) {
    case "dateTime": return new DateTimeWidget(ctx);
    case "weather": return new WeatherWidget(ctx);
    case "calendar": return new CalendarWidget(ctx);
    case "stockCrypto": return new StockCryptoWidget(ctx);
    case "notifications": return new NotificationsWidget(ctx);
    case "countdown": return new CountdownWidget(ctx);
    default: return null;
  }
}

// ============================================================
//  BASE WIDGET
// ============================================================

class BaseWidget {
  constructor(ctx) {
    this.ctx = ctx;
    this.colors = ctx.colors;
    this.big = ctx.big;
    this.scale = ctx.scale;
    this.settings = ctx.settings;
    this._alive = true;
    this.REFRESH_INTERVAL = 60;

    this._build();
  }

  fs(size) {
    return Math.max(Math.round(size * this.scale), 8);
  }

  _build() {
    const { container, colors, big, scale } = this.ctx;

    // Card element
    this.card = document.createElement("div");
    this.card.className = "widget-card";
    this.card.style.setProperty("--scale", scale);
    this.card.style.background = colors.widget_bg;
    this.card.style.border = `1px solid ${colors.border}`;
    this.card.style.borderRadius = "30px";
    container.appendChild(this.card);

    // Inner
    this.inner = document.createElement("div");
    this.inner.className = "widget-inner";
    this.card.appendChild(this.inner);

    this.build();
  }

  header(icon, title) {
    const c = this.colors;
    const hdr = document.createElement("div");
    hdr.className = "widget-header";
    const span = document.createElement("span");
    span.textContent = `${icon} ${title}`;
    span.style.color = getContrastAwareTextColor(c.widget_bg, c.accent);
    hdr.appendChild(span);
    this.inner.appendChild(hdr);

    const line = document.createElement("div");
    line.className = "widget-header-line";
    line.style.background = c.accent;
    this.inner.appendChild(line);
  }

  build() {}

  fetchData() {}

  scheduleRefresh() {
    if (!this.REFRESH_INTERVAL || this.REFRESH_INTERVAL >= 999999) return;
    const interval = this.REFRESH_INTERVAL * 1000;
    this._refreshTimer = setInterval(() => {
      if (!this._alive) return;
      try { this.fetchData(); } catch (e) { console.warn(`[${this.constructor.name}] refresh error:`, e); }
    }, interval);
    // Initial fetch
    setTimeout(() => { if (this._alive) this.fetchData(); }, 100);
  }

  destroy() {
    this._alive = false;
    if (this._refreshTimer) clearInterval(this._refreshTimer);
    if (this._tickTimer) clearInterval(this._tickTimer);
    if (this.card && this.card.parentNode) {
      this.card.parentNode.removeChild(this.card);
    }
  }

class CalendarWidget extends BaseWidget {
  constructor(ctx) {
    super(ctx);
    this.REFRESH_INTERVAL = 300;
    this.scheduleRefresh();
  }

  build() {
    this.header("", "CALENDAR");
    this.listFrame = document.createElement("div");
    this.listFrame.className = "widget-body";
    this.inner.appendChild(this.listFrame);
    this._setStatus("Loading calendar...");
  }

  async fetchData() {
    try {
      const resp = await fetch(`${SERVER_URL}/calendar/events`);
      if (resp.status === 401) {
        this._setStatus("Google Calendar not connected.\nPlease connect in Settings.");
        return;
      }
      if (resp.status !== 200) {
        this._setStatus(`Server error: ${resp.status}`);
        return;
      }
      const data = await resp.json();
      this._renderEvents(data.events || []);
    } catch (exc) {
      if (exc.message.includes("fetch") || exc.message.includes("network")) {
        this._setStatus("Server not reachable.\n Start server.py");
      } else {
        this._setStatus(`Error: ${String(exc).substring(0, 50)}`);
      }
    }
  }

  _renderEvents(events) {
    this._clear();
    const maxEv = this.big ? 6 : 3;
    if (!events.length) {
      this._setStatus("No upcoming events");
      return;
    }
    for (const ev of events.slice(0, maxEv)) {
      const startRaw = ev.start?.dateTime || ev.start?.date || "";
      let startFmt = startRaw.substring(0, 10);
      try {
        const dt = new Date(startRaw);
        if (!isNaN(dt)) {
          startFmt = `${String(dt.getMonth()+1).padStart(2,"0")}-${String(dt.getDate()).padStart(2,"0")} ${String(dt.getHours()).padStart(2,"0")}:${String(dt.getMinutes()).padStart(2,"0")}`;
        }
      } catch (_) {}

      const summary = (ev.summary || "No title").substring(0, 35);

      const row = document.createElement("div");
      row.className = "list-row";

      const dateCol = document.createElement("div");
      dateCol.className = "date-col";
      dateCol.textContent = ` ${startFmt}`;
      dateCol.style.color = getContrastAwareTextColor(this.colors.widget_bg, this.colors.accent);
      row.appendChild(dateCol);

      const info = document.createElement("div");
      info.className = "info";
      const line1 = document.createElement("div");
      line1.className = "line1";
      line1.textContent = summary;
      line1.style.color = this.colors.text;
      info.appendChild(line1);
      row.appendChild(info);

      this.listFrame.appendChild(row);
    }
  }

  _clear() {
    this.listFrame.innerHTML = "";
  }

  _setStatus(msg) {
    this._clear();
    const div = document.createElement("div");
    div.className = "status-msg";
    div.style.color = this.colors.muted;
    div.textContent = msg;
    this.listFrame.appendChild(div);
  }
}

  }

  build() {
    this.header("", "MESSAGES");
    this.listFrame = document.createElement("div");
    this.listFrame.className = "widget-body";
    this.listFrame.style.overflow = "hidden";
    this.inner.appendChild(this.listFrame);
    this._setStatus("Loading messages...");
  }

  async fetchData() {
    try {
      const resp = await fetch(`${SERVER_URL}/notifications/messages`);
      if (resp.status === 401) {
        this._setStatus("Gmail not connected.\nPlease connect in Settings.");
        return;
      }
      if (resp.status === 403) {
        this._setStatus("No Gmail permission.\nPlease reconnect your account.");
        return;
      }
      if (resp.status !== 200) {
        this._setStatus(`Server error: ${resp.status}`);
        return;
      }
      const data = await resp.json();
      this._renderMessages(data.messages || []);
    } catch (exc) {
      if (exc.message.includes("fetch") || exc.message.includes("network")) {
        this._setStatus("Server not reachable.\n Start server.py");
      } else {
        this._setStatus(`Error: ${String(exc).substring(0, 50)}`);
      }
    }
  }

  _renderMessages(messages) {
    this._clear();
    if (!messages.length) {
      this._setStatus("No new messages");
      return;
    }
    for (const msg of messages.slice(0, 10)) {
      this._appendRow(msg);
    }
    this._trimOverflow();
  }

  _appendRow(msg) {
    const isUnread = msg.unread || false;
    const row = document.createElement("div");
    row.className = "list-row";

    const dot = document.createElement("div");
    dot.className = "dot";
    dot.textContent = isUnread ? "" : "";
    dot.style.color = isUnread ? this.colors.accent : this.colors.muted;
    row.appendChild(dot);

    const info = document.createElement("div");
    info.className = "info";

    const from = document.createElement("div");
    from.className = "line1";
    from.textContent = msg.from || "(unknown sender)";
    from.style.color = isUnread ? this.colors.text : this.colors.muted;
    info.appendChild(from);

    const subj = document.createElement("div");
    subj.className = "line2";
    subj.textContent = msg.subject || "(no subject)";
    subj.style.color = this.colors.muted;
    info.appendChild(subj);

    row.appendChild(info);
    this.listFrame.appendChild(row);
  }

  _trimOverflow() {
    const avail = this.listFrame.clientHeight;
    if (avail <= 1) return;
    const rows = [...this.listFrame.children];
    let total = rows.reduce((sum, r) => sum + r.offsetHeight, 0);
    while (rows.length && total > avail) {
      const last = rows.pop();
      last.remove();
      total -= last.offsetHeight;
    }
  }

  _clear() {
    this.listFrame.innerHTML = "";
  }

  _setStatus(msg) {
    this._clear();
    const div = document.createElement("div");
    div.className = "status-msg";
    div.style.color = this.colors.muted;
    div.textContent = msg;
    this.listFrame.appendChild(div);
  }
}

    this.lblDate.style.color = this.colors.muted;
    this.lblDate.textContent = "";

    spacer2.className = "widget-spacer";

      this.lblCd.textContent = "No date set";
      this.lblDate.textContent = "Set date in Settings";
    } else {
      this._tick();
    }
  }

  _tick() {
    if (!this._alive) return;
    const target = new Date(this._targetDate);
    if (isNaN(target)) {
      this.lblCd.textContent = "Invalid date";
      return;
    }

    const now = new Date();
    const diff = target - now;

    if (diff <= 0) {
      this.lblCd.textContent = " Reached!";
      this.lblDate.textContent = target.toLocaleDateString("en-GB", { month: "2-digit", day: "2-digit", year: "numeric" }).replace(/\//g, "-");
      return;
    }

    const totalSecs = Math.floor(diff / 1000);
    const days = Math.floor(totalSecs / 86400);
    const hours = Math.floor((totalSecs % 86400) / 3600);
    const mins = Math.floor((totalSecs % 3600) / 60);
    const secs = totalSecs % 60;

    if (days > 0) {
      this.lblCd.textContent = `${days}D ${String(hours).padStart(2,"0")}:${String(mins).padStart(2,"0")}:${String(secs).padStart(2,"0")}`;
    } else {
      this.lblCd.textContent = `${String(hours).padStart(2,"0")}:${String(mins).padStart(2,"0")}:${String(secs).padStart(2,"0")}`;
    }

    const targetStr = target.toLocaleDateString("en-GB", { month: "2-digit", day: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" }).replace(/\//g, "-");
    this.lblDate.textContent = `Target: ${targetStr}`;

    this._tickTimer = setTimeout(() => this._tick(), 1000);
  }
}

// ============================================================
//  DASHBOARD BUILDER
// ============================================================

async function buildDashboard() {
  const cfg = settings;
  const colors = extractColors(cfg);
  applyTheme(colors);

  const content = document.getElementById("content");
  content.innerHTML = "";
  destroyWidgets();

  // Header
  const hdr = document.getElementById("header");
  const titleEl = hdr.querySelector("h1");
  if (titleEl) titleEl.style.color = getContrastAwareTextColor(colors.bg, colors.accent);
  const headerLine = document.getElementById("header-line");
  if (headerLine) headerLine.style.background = colors.accent;

  // Footer
  const fLine = document.getElementById("footer-line");
  if (fLine) fLine.style.background = colors.border;
  const footerHint = document.getElementById("footer-hint");
  if (footerHint) footerHint.style.color = colors.muted;
  const footerLoc = document.getElementById("footer-location");
  if (footerLoc) {
    footerLoc.style.color = colors.muted;
    const loc = cfg.location || "";
    footerLoc.textContent = loc ? ` ${loc}` : "";
  }

  // Determine enabled widgets
  const widgetsEn = cfg.widgets || {};
  let enabled = Object.entries(widgetsEn).filter(([_, v]) => v).map(([k]) => k);
  if (!enabled.length) enabled = ["dateTime"];

  // Respect widget order
  const order = cfg.widgetOrder || [];
  const ordered = [...order.filter(k => enabled.includes(k)), ...enabled.filter(k => !order.includes(k))];
  enabled = ordered;

  // Resolve layout
  const rects = resolveWidgetLayout(enabled, cfg.widgetLayout);
  const margin = 0.006;

  // Content height estimate
  const contentHPx = Math.max(200, window.innerHeight - 145);

  for (const key of enabled) {
    const rect = rects[key];
    if (!rect) continue;

    const big = rect.h > 50;
    const areaFrac = (rect.w / 100) * (rect.h / 100);
    let scale = Math.pow(areaFrac / 0.10, 0.5);
    const cardHPx = contentHPx * rect.h / 100;
    const natural = (NATURAL_HEIGHT[key] || 150) + (big ? BIG_EXTRA_HEIGHT : 0) * 1.10;
    scale = Math.max(0.8, Math.min(scale, cardHPx / natural, 2.6));

    const widget = createWidget(key, content, colors, big, cfg, scale, cardHPx);
    if (!widget) continue;

    widget.card.style.left = `${rect.x + margin * 100 / rect.w}%`;
    // Actually use absolute positioning relative to content
    widget.card.style.left = `${rect.x}%`;
    widget.card.style.top = `${rect.y}%`;
    widget.card.style.width = `${rect.w}%`;
    widget.card.style.height = `${rect.h}%`;

    // Apply margin via inset
    const m = margin * 100;
    widget.card.style.left = `calc(${rect.x}% + ${m * rect.w / 100}px)`;
    // Simpler: just use calc with the margin
    widget.card.style.left = `calc(${rect.x}% + 6px)`;
    widget.card.style.top = `calc(${rect.y}% + 6px)`;
    widget.card.style.width = `calc(${rect.w}% - 12px)`;
    widget.card.style.height = `calc(${rect.h}% - 12px)`;

    widgetInstances.push(widget);
  }
}

let lastSettingsJson = null;

async function watchSettings() {
  try {
    const resp = await fetch("settings.json?t=" + Date.now(), { cache: "no-store" });
    if (resp.ok) {
      const text = await resp.text();
      if (text !== lastSettingsJson) {
        lastSettingsJson = text;
        const newSettings = JSON.parse(text);
        if (JSON.stringify(newSettings) !== JSON.stringify(settings)) {
          settings = newSettings;
          buildDashboard();
        }
      }
    }
  } catch (e) {
    // Silently ignore - settings.json might not exist yet
  }
  setTimeout(watchSettings, 1000);
}

// ============================================================
//  KEYBOARD SHORTCUTS
// ============================================================

document.addEventListener("keydown", (e) => {
  if (["INPUT", "SELECT", "TEXTAREA"].includes(e.target.tagName)) return;

  if (e.key === "Escape") {
    if (document.fullscreenElement) document.exitFullscreen();
  } else if (e.key === "F11") {
    e.preventDefault();
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen();
    } else {
      document.exitFullscreen();
    }
  } else if (e.key === "r" || e.key === "R") {
    if (!e.ctrlKey && !e.metaKey) {
      location.reload();
    }
  } else if (e.key === "q" || e.key === "Q") {
    if (window.hermes?.send) {
      window.hermes.send("quit_dashboard");
    } else {
      window.close();
    }
  } else if (e.key === "b" || e.key === "B") {
    goBackToChat();
  }
});

// ============================================================
//  EXIT BUTTON
// ============================================================

function goBackToChat() {
  if (window.hermes?.send) {
    window.hermes.send("exit_preview");
    return;
  }
  try {
    if (window.opener || window.top !== window) {
      window.close();
      setTimeout(() => { if (!window.closed) window.history.back(); }, 200);
      return;
    }
  } catch(_) {}
  window.history.back();
}

document.getElementById("back-btn").addEventListener("click", goBackToChat);

// ============================================================
//  RESIZE HANDLER
// ============================================================

let resizeTimeout;
window.addEventListener("resize", () => {
  clearTimeout(resizeTimeout);
  resizeTimeout = setTimeout(() => buildDashboard(), 200);
});

// ============================================================
//  INIT
// ============================================================

(async () => {
  await loadSettings();
  await buildDashboard();
  watchSettings();
})();
</script>
</body>
</html>
